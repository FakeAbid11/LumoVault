name: lumovault
description: "LumoVault — Original quality photo and video backup powered by Telegram."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Theming
  dynamic_color: ^1.7.0

  # Database
  drift: ^2.20.0
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24

  # Background Work
  workmanager: ^0.9.0

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # TDLib - Telegram client
  tdlib: ^1.6.0

  # Permissions
  permission_handler: ^11.4.0

  # Image Loading
  cached_network_image: ^3.4.1

  # Media Scanning
  photo_manager: ^3.2.0

  # Map (Immich-style photo map). flutter_map renders OpenStreetMap tiles with
  # no API key; latlong2 supplies its LatLng type; the marker-cluster plugin
  # collapses nearby pins. geolocator is used ONLY to center the map on the
  # device's current location — photo coordinates come from photo_manager EXIF.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_map_marker_cluster: ^1.4.0
  geolocator: ^13.0.1

  # Battery/Charging State
  battery_plus: ^6.2.0

  # Video
  video_player: ^2.9.3

  # Utilities
  path_provider: ^2.1.5
  device_info_plus: ^11.3.0
  connectivity_plus: ^6.1.3
  share_plus: ^10.1.4
  package_info_plus: ^8.1.0
  url_launcher: ^6.3.1
  intl: ^0.20.2
  crypto: ^3.0.3
  convert: ^3.1.1
  path: ^1.8.0
  local_auth: ^3.0.2
  flutter_local_notifications: ^22.2.0
  sentry_flutter: ^8.14.2

  # Image processing (face crops)
  image: ^4.3.0

  # Material Symbols (Google Fonts icons)
  material_symbols_icons: ^4.2960.0

  # Face Detection & Embeddings (People tab)
  flutter_onnxruntime: ^1.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

  # Drift code generation
  drift_dev: ^2.20.0
  build_runner: ^2.4.13

  # Launcher icon generation. Used by `tool/prepare_app_icon.dart` (raster
  # cropping) and `dart run flutter_launcher_icons` (mipmap + adaptive icon
  # output). Dev-only: neither ships in the APK.
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/models/det_500m.onnx
    - assets/models/w600k_mbf.onnx

# Launcher icon generation — `dart run flutter_launcher_icons`.
#
# The three sources are produced from the raw logo render by
# `dart run tool/prepare_app_icon.dart`; run that first if the render changes.
# minSdk here is 23, so this emits both the legacy square mipmaps (API 23-25)
# and the adaptive background/foreground pair used from API 26 on.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: assets/icon/app_icon_background.png
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  min_sdk_android: 23

# Vendored workmanager_android patched to register plugins on the
# background isolate's FlutterEngine (upstream 0.9.0+2 does not — see
# packages/workmanager_android/.../BackgroundWorker.kt).
dependency_overrides:
  workmanager_android:
    path: packages/workmanager_android
