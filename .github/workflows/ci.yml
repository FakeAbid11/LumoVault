name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  analyze:
    name: Analyze & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: dart analyze --fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          flags: unittests
        # Deliberate: a codecov outage or rate-limit must not fail a build
        # whose analyze and test steps both passed. This is a reporting step,
        # not a correctness gate — the gates above are already blocking.
        continue-on-error: true

  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (debug)
        env:
          LUMOVAULT_TELEGRAM_API_ID: ${{ secrets.LUMOVAULT_TELEGRAM_API_ID }}
          LUMOVAULT_TELEGRAM_API_HASH: ${{ secrets.LUMOVAULT_TELEGRAM_API_HASH }}
        run: |
          # Secrets pasted into GitHub's UI can silently pick up a trailing
          # newline or stray whitespace (e.g. copied from a terminal or a
          # file that ended with one) — nothing in the GitHub UI shows this.
          # Once that lands inside a --dart-define=KEY=VALUE argument,
          # Flutter's arg parser stops recognizing --dart-define as a flag
          # at all and treats the whole malformed token as a positional
          # target-file override instead, producing the confusing
          # `Target file "--dart-define=..." not found` error with no hint
          # that whitespace was the actual cause. Strip it here so the
          # build works regardless of how the secret was pasted in.
          API_ID=$(printf '%s' "$LUMOVAULT_TELEGRAM_API_ID" | tr -d '[:space:]')
          API_HASH=$(printf '%s' "$LUMOVAULT_TELEGRAM_API_HASH" | tr -d '[:space:]')

          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "::error::LUMOVAULT_TELEGRAM_API_ID or LUMOVAULT_TELEGRAM_API_HASH is missing/empty. Check Settings > Secrets and variables > Actions."
            exit 1
          fi

          flutter build apk --debug --verbose \
            --dart-define=LUMOVAULT_TELEGRAM_API_ID="$API_ID" \
            --dart-define=LUMOVAULT_TELEGRAM_API_HASH="$API_HASH" \
            > build.log 2>&1 || {
            echo "## Build Failed - Full build.log (last 120 lines):"
            echo '```'
            tail -n 120 build.log
            echo '```'
            echo "## Build Failed - Key Errors:"
            echo '```'
            grep -iE "what went wrong|FAILURE:|could not|error:|Exception|Execution failed|problem occurred|unresolved|incompatible|requires|minimum" build.log | head -n 60
            echo '```'
            exit 1
          }

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          retention-days: 7

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
