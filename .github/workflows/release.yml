name: Release APK

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'App version (e.g. 1.0.1 or 1.0.1+5). Leave blank to keep current pubspec version.'
        required: false

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  analyze:
    name: Analyze & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: dart analyze --fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          flags: unittests
        continue-on-error: true

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. Run the 'Generate Release Keystore' workflow first."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/lumovault-release.jks

      - name: Write key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::One or more signing secrets are missing: KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD."
            exit 1
          fi
          {
            echo "storeFile=lumovault-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Set app version
        if: ${{ github.event.inputs.app_version != '' }}
        run: |
          VERSION="${{ github.event.inputs.app_version }}"
          echo "Setting app version to: $VERSION"
          # pubspec.yaml line looks like:  version: 1.0.0+1
          sed -i "s/^version: .*/version: $VERSION/" pubspec.yaml

      - name: Build release APK
        env:
          LUMOVAULT_TELEGRAM_API_ID: ${{ secrets.LUMOVAULT_TELEGRAM_API_ID }}
          LUMOVAULT_TELEGRAM_API_HASH: ${{ secrets.LUMOVAULT_TELEGRAM_API_HASH }}
        run: |
          API_ID=$(printf '%s' "$LUMOVAULT_TELEGRAM_API_ID" | tr -d '[:space:]')
          API_HASH=$(printf '%s' "$LUMOVAULT_TELEGRAM_API_HASH" | tr -d '[:space:]')

          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "::error::LUMOVAULT_TELEGRAM_API_ID or LUMOVAULT_TELEGRAM_API_HASH is missing/empty."
            exit 1
          fi

          flutter build apk --release --verbose \
            --dart-define=LUMOVAULT_TELEGRAM_API_ID="$API_ID" \
            --dart-define=LUMOVAULT_TELEGRAM_API_HASH="$API_HASH" \
            > build.log 2>&1 || {
            echo "## Build Failed - Full build.log (last 120 lines):"
            echo '```'
            tail -n 120 build.log
            echo '```'
            echo "## Build Failed - Key Errors:"
            echo '```'
            grep -iE "what went wrong|FAILURE:|could not|error:|Exception|Execution failed|problem occurred|unresolved|incompatible|requires|minimum" build.log | head -n 60
            echo '```'
            exit 1
          }

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: release-build-log-${{ github.sha }}
          path: build.log
          retention-days: 7

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: lumovault-release-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
