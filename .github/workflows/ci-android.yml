name: CI (Android)

on:
  workflow_dispatch:

env:
  JAVA_VERSION: '21'

jobs:
  lint:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('lumovault-android/**/*.gradle*', 'lumovault-android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x lumovault-android/gradlew

      - name: Build Debug APK
        working-directory: lumovault-android
        env:
          LUMOVAULT_TELEGRAM_API_ID: ${{ secrets.LUMOVAULT_TELEGRAM_API_ID }}
          LUMOVAULT_TELEGRAM_API_HASH: ${{ secrets.LUMOVAULT_TELEGRAM_API_HASH }}
        run: |
          # Write local.properties with secrets for BuildConfig injection
          if [ -n "$LUMOVAULT_TELEGRAM_API_ID" ] && [ -n "$LUMOVAULT_TELEGRAM_API_HASH" ]; then
            cat > local.properties <<EOF
            telegram.api.id=$LUMOVAULT_TELEGRAM_API_ID
            telegram.api.hash=$LUMOVAULT_TELEGRAM_API_HASH
            EOF
          fi

          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1 || {
            echo "## Build Failed - Full build.log (last 120 lines):"
            echo '```'
            tail -n 120 build.log
            echo '```'
            echo "## Build Failed - Key Errors:"
            echo '```'
            grep -iE "what went wrong|FAILURE:|could not|error:|Exception|Execution failed|problem occurred|unresolved|incompatible|requires|minimum" build.log | head -n 60
            echo '```'
            exit 1
          }

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-build-log-${{ github.sha }}
          path: lumovault-android/build.log
          retention-days: 7

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: android-apk-${{ github.sha }}
          path: lumovault-android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('lumovault-android/**/*.gradle*', 'lumovault-android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x lumovault-android/gradlew

      - name: Run unit tests
        working-directory: lumovault-android
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee test.log

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-test-log-${{ github.sha }}
          path: lumovault-android/test.log
          retention-days: 7
