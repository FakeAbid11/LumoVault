name: Generate Release Keystore

on:
  workflow_dispatch:
    inputs:
      keyAlias:
        description: 'Key alias for the keystore'
        required: false
        default: 'lumovault'
      storePassword:
        description: 'Keystore password'
        required: true
      keyPassword:
        description: 'Key password'
        required: true

jobs:
  generate:
    name: Generate Keystore
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          KEY_ALIAS="${{ github.event.inputs.keyAlias || 'lumovault' }}"
          STORE_PASSWORD="${{ github.event.inputs.storePassword }}"
          KEY_PASSWORD="${{ github.event.inputs.keyPassword }}"

          keytool -genkey -v \
            -keystore lumovault-release.jks \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=LumoVault, OU=Development, O=LumoVault, L=Unknown, ST=Unknown, C=US"

          KEYSORE_BASE64=$(base64 -w 0 lumovault-release.jks)

          echo "## Generated Keystore" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Save these as GitHub Secrets in **Settings > Secrets and variables > Actions**:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`KEYSTORE_BASE64\` | *(see below)* |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`KEYSTORE_PASSWORD\` | \`$STORE_PASSWORD\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`KEY_ALIAS\` | \`$KEY_ALIAS\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`KEY_PASSWORD\` | \`$KEY_PASSWORD\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### KEYSTORE_BASE64" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$KEYSORE_BASE64" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Copy the base64 string above into the \`KEYSTORE_BASE64\` secret." >> "$GITHUB_STEP_SUMMARY"
