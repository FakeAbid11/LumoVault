name: Release APK (Android)

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'App version (e.g. 1.0.1 or 1.0.1+5). Leave blank to keep current version.'
        required: false

env:
  JAVA_VERSION: '21'

jobs:
  lint:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('lumovault-android/**/*.gradle*', 'lumovault-android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x lumovault-android/gradlew

      - name: Set app version
        if: ${{ github.event.inputs.app_version != '' }}
        working-directory: lumovault-android
        run: |
          RAW_VERSION="${{ github.event.inputs.app_version }}"
          VERSION=$(printf '%s' "$RAW_VERSION" | tr ',' '.' | tr -d '[:space:]')

          # Extract versionName and versionCode
          VERSION_NAME=$(echo "$VERSION" | cut -d'+' -f1)
          VERSION_CODE=$(echo "$VERSION" | cut -d'+' -f2)

          if [ "$VERSION_NAME" = "$VERSION_CODE" ]; then
            VERSION_CODE=""
          fi

          echo "Setting version: name=$VERSION_NAME code=$VERSION_CODE"

          # Update build.gradle.kts
          if [ -n "$VERSION_CODE" ]; then
            sed -i "s/versionCode = [0-9]*/versionCode = $VERSION_CODE/" app/build.gradle.kts
          fi
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. Run the 'Generate Release Keystore' workflow first."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > lumovault-android/lumovault-release.jks

      - name: Write key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::One or more signing secrets are missing: KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD."
            exit 1
          fi
          cat > lumovault-android/key.properties <<EOF
          storeFile=../lumovault-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Write local.properties
        env:
          LUMOVAULT_TELEGRAM_API_ID: ${{ secrets.LUMOVAULT_TELEGRAM_API_ID }}
          LUMOVAULT_TELEGRAM_API_HASH: ${{ secrets.LUMOVAULT_TELEGRAM_API_HASH }}
        run: |
          cat > lumovault-android/local.properties <<EOF
          telegram.api.id=${LUMOVAULT_TELEGRAM_API_ID:-}
          telegram.api.hash=${LUMOVAULT_TELEGRAM_API_HASH:-}
          EOF

      - name: Build release APK
        working-directory: lumovault-android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace > build.log 2>&1 || {
            echo "## Build Failed - Full build.log (last 120 lines):"
            echo '```'
            tail -n 120 build.log
            echo '```'
            echo "## Build Failed - Key Errors:"
            echo '```'
            grep -iE "what went wrong|FAILURE:|could not|error:|Exception|Execution failed|problem occurred|unresolved|incompatible|requires|minimum" build.log | head -n 60
            echo '```'
            exit 1
          }

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-release-build-log-${{ github.sha }}
          path: lumovault-android/build.log
          retention-days: 7

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: lumovault-android-release-${{ github.sha }}
          path: lumovault-android/app/build/outputs/apk/release/*.apk
          retention-days: 30
